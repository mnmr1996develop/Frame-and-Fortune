services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: mnmr1996development
      POSTGRES_PASSWORD: mnmr1996development
      POSTGRES_DB: frame_and_fortune
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - keycloak-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mnmr1996development -d frame_and_fortune" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/frame_and_fortune
      KC_DB_USERNAME: mnmr1996development
      KC_DB_PASSWORD: mnmr1996development

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_IMPORT: /opt/keycloak/data/import/my-realm.json
    volumes:
      - ./keycloak-data:/opt/keycloak/data/import
    ports:
      - "7080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network
networks:
  keycloak-network: