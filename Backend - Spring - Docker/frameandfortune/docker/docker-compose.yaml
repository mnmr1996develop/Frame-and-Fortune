services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: mnmr1996development
      POSTGRES_PASSWORD: mnmr1996development
      POSTGRES_DB: frame_and_fortune
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mnmr1996development -d frame_and_fortune" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s